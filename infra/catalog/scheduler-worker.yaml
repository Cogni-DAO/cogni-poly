#
# Catalog v2 (docs/spec/catalog-v2.md). Deploy unit "scheduler-worker" owns
# 1 image. No public Ingress, no per-node migrator. Lives alongside poly in
# the same GHCR package (ghcr.io/cogni-dao/cogni-poly), discriminated by
# image_tag_suffix.

schema_version: 2
name: scheduler-worker
type: service

deploy:
  candidate_a_branch: deploy/candidate-a-scheduler-worker
  preview_branch: deploy/preview-scheduler-worker
  production_branch: deploy/production-scheduler-worker
  path_prefix: services/scheduler-worker/
  port: 9000

images:
  - name: scheduler-worker
    role: app
    dockerfile: services/scheduler-worker/Dockerfile
    image_name: ghcr.io/cogni-dao/cogni-poly
    image_tag_suffix: "-scheduler-worker"
    build:
      cache_scope: build-scheduler-worker
