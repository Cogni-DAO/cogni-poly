#
# Catalog v2 (docs/spec/catalog-v2.md). Deploy unit "poly" owns 2 images today:
# the node app + the paper-trading sidecar. A real per-node migrator image
# would land as a third entry — currently the doltgres migration runs in-process
# inside the node-app image (see infra/k8s/overlays/<env>/poly/kustomization.yaml
# initContainer block), so there is no separate migrator build unit yet.

schema_version: 2
name: poly
type: node
node_id: "5ed2d64f-2745-4676-983b-2fb7e05b2eba"

deploy:
  candidate_a_branch: deploy/candidate-a-poly
  preview_branch: deploy/preview-poly
  production_branch: deploy/production-poly
  path_prefix: nodes/poly/
  port: 3000
  public_url:
    candidate-a: https://poly-test.cognidao.org
    preview: https://poly-preview.cognidao.org
    production: https://poly.cognidao.org

images:
  - name: poly
    role: app
    dockerfile: nodes/poly/app/Dockerfile
    image_name: ghcr.io/cogni-dao/cogni-poly
    image_tag_suffix: "-poly"
    path_prefix: nodes/poly/app/
    build:
      target: runner
      cache_scope: build-poly

  - name: poly-paper-sidecar
    role: sidecar
    dockerfile: nodes/poly/sidecars/paper-trader/Dockerfile
    image_name: ghcr.io/cogni-dao/poly-paper-sidecar
    image_tag_suffix: ""
    path_prefix: nodes/poly/sidecars/paper-trader/
    build:
      context: nodes/poly/sidecars/paper-trader
      target: base
      test_target: test
      cache_scope: poly-paper-sidecar

  # Catalog v2 e2e exercise sidecar — see nodes/poly/sidecars/echo/AGENTS.md.
  # Candidate-a + preview overlays only. Production overlay deliberately omits
  # this image to exercise promote-k8s-image.sh's exit-2 skip path.
  - name: poly-echo-sidecar
    role: sidecar
    dockerfile: nodes/poly/sidecars/echo/Dockerfile
    image_name: ghcr.io/cogni-dao/poly-echo-sidecar
    image_tag_suffix: ""
    path_prefix: nodes/poly/sidecars/echo/
    build:
      context: nodes/poly/sidecars/echo
      target: base
      cache_scope: poly-echo-sidecar
