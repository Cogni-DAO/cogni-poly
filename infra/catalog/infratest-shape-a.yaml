#
# Catalog v2 (docs/spec/catalog-v2.md) - Shape A re-exercise on top of
# task.5006 (image-native build-provenance via OCI labels). One image, no
# public Ingress. Temporary mirror of poly-test-worker; rolled back after
# candidate-a validation.

schema_version: 2
name: infratest-shape-a
type: service

deploy:
  candidate_a_branch: deploy/candidate-a-infratest-shape-a
  preview_branch: deploy/preview-infratest-shape-a
  production_branch: deploy/production-infratest-shape-a
  path_prefix: services/infratest-shape-a/
  port: 9000

images:
  - name: infratest-shape-a
    role: app
    dockerfile: services/infratest-shape-a/Dockerfile
    image_name: ghcr.io/cogni-dao/infratest-shape-a
    image_tag_suffix: ""
    build:
      cache_scope: build-infratest-shape-a
