apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-production

resources:
  - ../../../base/scheduler-worker

# Image digest — updated by manual PR for production promotion.
images:
  - name: ghcr.io/cogni-dao/cogni-poly
    newName: ghcr.io/cogni-dao/cogni-poly
    newTag: "production-placeholder-scheduler-worker"

patches:
  - target:
      kind: ConfigMap
      name: scheduler-worker-config
    patch: |
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-production"
      - op: replace
        path: /data/IMAGE_DIGEST
        value: "production-placeholder-scheduler-worker"

  # bug.5025 (2026-05-22): no env-specific external-services overrides.
  # The base manifest (`infra/k8s/base/scheduler-worker/external-services.yaml`)
  # provides selectorless Services + EndpointSlices pointing at 10.42.0.1
  # (k3s cni0 gateway). Read the base file header for the full rationale.
