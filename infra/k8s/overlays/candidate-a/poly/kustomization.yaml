apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-candidate-a

resources:
  - ../../../base/node-app

namePrefix: poly-

images:
  - name: ghcr.io/cogni-dao/cogni-poly
    newName: ghcr.io/cogni-dao/cogni-poly
    digest: "sha256:96b625a2ef6c397fe2610ae7bee30827aa875a01632916f9d614f422ae1b4ab4"
  - name: ghcr.io/cogni-dao/poly-paper-sidecar
    newName: ghcr.io/cogni-dao/poly-paper-sidecar
    digest: "sha256:18cab718567da6135c45f84f3624a456862d97b59f16114f1a5cc83fa20b2d11"
  # poly-paper-sidecar is a catalog-v2 image: it ships through pr-build's matrix
  # like any other image (infra/catalog/poly.yaml → images[role: sidecar]).
  # promote-build-payload + image-name-aware promote-k8s-image keep the host
  # and sidecar entries here independent — no manual sha bump needed.

patches:
  - target:
      kind: ConfigMap
      name: node-app-config
    patch: |
      - op: replace
        path: /data/NODE_NAME
        value: "poly"
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/LITELLM_BASE_URL
        value: "http://poly-litellm-external:4000"
      - op: replace
        path: /data/TEMPORAL_ADDRESS
        value: "poly-temporal-external:7233"
      - op: replace
        path: /data/REDIS_URL
        value: "redis://poly-redis-external:6379"
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://poly-test.cognidao.org"
      # proj.poly-paper-trading PR 2: force every placement through the
      # poly-paper-sidecar so flighted PRs cannot burn real USDC. Belt-and-
      # suspenders + per-target mode='paper' DB rows. Production overlay does
      # NOT set this; the paper sidecar is candidate-a / preview only.
      - op: add
        path: /data/PAPER_ENFORCE_MODE
        value: "paper"
      - op: add
        path: /data/PAPER_SIDECAR_URL
        value: "http://localhost:9100"
  - target:
      kind: Service
      name: node-app
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30100
      - op: replace
        path: /spec/ports/0/targetPort
        value: 3100
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: "poly"
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: "poly-node-app-secrets"
      - op: replace
        path: /spec/template/spec/initContainers/0/envFrom/1/secretRef/name
        value: "poly-node-app-secrets"
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3100
      - op: add
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: "poly"
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: "poly"

  # proj.poly-paper-trading PR 2: poly-paper-sidecar — Python sidecar wrapping
  # agent-next/polymarket-paper-trader (MIT) behind an HTTP API. The TS
  # PaperAdapter speaks to it over pod-loopback at http://localhost:9100.
  # v0 image is a placeholder (501 on Run-phase endpoints); the actual
  # upstream-engine wiring lands in a follow-up commit (PR3 design pass
  # forthcoming).
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: poly-paper-sidecar
          # No tag — kustomize substitutes the digest pinned in the `images:`
          # block above.
          image: ghcr.io/cogni-dao/poly-paper-sidecar
          ports:
            - containerPort: 9100
              name: paper
              protocol: TCP
          livenessProbe:
            httpGet: { path: /healthz, port: paper }
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /healthz, port: paper }
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { memory: "128Mi", cpu: "50m" }
            limits: { memory: "384Mi", cpu: "500m" }

  # task.0370 step 1: Doltgres knowledge-plane migrator runs as a second initContainer
  # on the poly Deployment. DATABASE_URL maps to DOLTGRES_URL_POLY (separate from
  # the Postgres DATABASE_URL the main container + first initContainer use).
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: migrate-doltgres
          image: ghcr.io/cogni-dao/cogni-poly:placeholder
          command:
            - /bin/sh
            - -c
            - exec node /app/nodes/$(NODE_NAME)/app/migrate-doltgres.mjs /app/nodes/$(NODE_NAME)/app/doltgres-migrations
          envFrom:
            - configMapRef:
                name: poly-node-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: poly-node-app-secrets
                  key: DOLTGRES_URL_POLY
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  # bug.0295: VM discovery via DNS (candidate-a.vm.cognidao.org).
  # Convert base headless Services → ExternalName; delete EndpointSlices.
  # No env-state.yaml, no `replacements:` — reprovision = DNS update only.
  - target: { kind: Service, name: postgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: postgres-external
      spec:
        type: ExternalName
        externalName: candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: temporal-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: temporal-external
      spec:
        type: ExternalName
        externalName: candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: litellm-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: litellm-external
      spec:
        type: ExternalName
        externalName: candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: redis-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: redis-external
      spec:
        type: ExternalName
        externalName: candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: Service, name: doltgres-external }
    patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: doltgres-external
      spec:
        type: ExternalName
        externalName: candidate-a.vm.cognidao.org
        clusterIP: null
  - target: { kind: EndpointSlice, name: postgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: postgres-external-1
  - target: { kind: EndpointSlice, name: temporal-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: temporal-external-1
  - target: { kind: EndpointSlice, name: litellm-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: litellm-external-1
  - target: { kind: EndpointSlice, name: redis-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: redis-external-1
  - target: { kind: EndpointSlice, name: doltgres-external-1 }
    patch: |
      $patch: delete
      apiVersion: discovery.k8s.io/v1
      kind: EndpointSlice
      metadata:
        name: doltgres-external-1
