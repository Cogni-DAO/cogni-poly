apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-candidate-a

resources:
  - ../../../base/node-app

# Sidecar container shape lives next to its source (catalog v2). Digests still
# resolved from `images:` block below by promote-k8s-image.sh.
components:
  - ../../../components/sidecars/poly-paper-sidecar
  - ../../../components/sidecars/poly-echo-sidecar

namePrefix: poly-

images:
  - name: ghcr.io/cogni-dao/cogni-poly
    newName: ghcr.io/cogni-dao/cogni-poly
    digest: "sha256:d0bea8a8a50b74bc1120945064320c0e4eedd904162e251194bda48cc84c79ec"
  - name: ghcr.io/cogni-dao/poly-paper-sidecar
    newName: ghcr.io/cogni-dao/poly-paper-sidecar
    digest: "sha256:7463b9be0f0e19a10cd2bdceb6885261d8537042cbcfcff174cc5af5a4216823"
  - name: ghcr.io/cogni-dao/poly-echo-sidecar
    newName: ghcr.io/cogni-dao/poly-echo-sidecar
    digest: "sha256:330e3253b9b726e22f46fe79cfeeefd9472f725762f128a0be4b5345074adc31"
  # Sidecar digests are written by promote-build-payload + image-name-aware
  # promote-k8s-image (catalog v2). The poly-echo-sidecar placeholder newTag is
  # overwritten on first promote. Container shape lives in each sidecar's
  # k8s/ Component (referenced under `components:` above).

patches:
  - target:
      kind: ConfigMap
      name: node-app-config
    patch: |
      - op: replace
        path: /data/NODE_NAME
        value: "poly"
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-candidate-a"
      - op: replace
        path: /data/LITELLM_BASE_URL
        value: "http://poly-litellm-external:4000"
      - op: replace
        path: /data/TEMPORAL_ADDRESS
        value: "poly-temporal-external:7233"
      - op: replace
        path: /data/REDIS_URL
        value: "redis://poly-redis-external:6379"
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://poly-test.cognidao.org"
      # proj.poly-paper-trading PR 2: force every placement through the
      # poly-paper-sidecar so flighted PRs cannot burn real USDC. Belt-and-
      # suspenders + per-target mode='paper' DB rows. Production overlay does
      # NOT set this; the paper sidecar is candidate-a / preview only.
      - op: add
        path: /data/PAPER_ENFORCE_MODE
        value: "paper"
      - op: add
        path: /data/PAPER_SIDECAR_URL
        value: "http://localhost:9100"
  - target:
      kind: Service
      name: node-app
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30100
      - op: replace
        path: /spec/ports/0/targetPort
        value: 3100
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: "poly"
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: "poly-node-app-secrets"
      - op: replace
        path: /spec/template/spec/initContainers/0/envFrom/1/secretRef/name
        value: "poly-node-app-secrets"
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3100
      - op: add
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: "poly"
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: "poly"

  # task.0370 step 1: Doltgres knowledge-plane migrator runs as a second initContainer
  # on the poly Deployment. DATABASE_URL maps to DOLTGRES_URL_POLY (separate from
  # the Postgres DATABASE_URL the main container + first initContainer use).
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: migrate-doltgres
          image: ghcr.io/cogni-dao/cogni-poly:placeholder
          command:
            - /bin/sh
            - -c
            - exec node /app/nodes/$(NODE_NAME)/app/migrate-doltgres.mjs /app/nodes/$(NODE_NAME)/app/doltgres-migrations
          envFrom:
            - configMapRef:
                name: poly-node-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: poly-node-app-secrets
                  key: DOLTGRES_URL_POLY
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  # bug.5025 (2026-05-22): no env-specific external-services overrides.
  # The base manifest (`infra/k8s/base/node-app/external-services.yaml`)
  # provides selectorless Services + EndpointSlices pointing at 10.42.0.1
  # (k3s cni0 gateway). Read the base file header for the full rationale.
