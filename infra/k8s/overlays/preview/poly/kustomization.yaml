apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cogni-preview

resources:
  - ../../../base/node-app

# Sidecar container shape lives next to its source (catalog v2). Digests still
# resolved from `images:` block below by promote-k8s-image.sh.
components:
  - ../../../components/sidecars/poly-paper-sidecar
  - ../../../components/sidecars/poly-echo-sidecar

namePrefix: poly-

images:
  - name: ghcr.io/cogni-dao/cogni-poly
    newName: ghcr.io/cogni-dao/cogni-poly
    digest: "sha256:78af980b68e4dfe1ede72f02923b9817ea525f1e0b258c4e0a870688af5090b8"
  - name: ghcr.io/cogni-dao/poly-paper-sidecar
    newName: ghcr.io/cogni-dao/poly-paper-sidecar
    digest: "sha256:c4f5d17dabf4099c1393ba32f96bc7aa684ec8c7563a76d6d98fbb72cdd0d97a"
  - name: ghcr.io/cogni-dao/poly-echo-sidecar
    newName: ghcr.io/cogni-dao/poly-echo-sidecar
    newTag: "preview-placeholder-poly-echo-sidecar"
  # Sidecar digests written automatically by promote-build-payload (catalog v2).
  # poly-echo-sidecar placeholder is overwritten on first promote. Container
  # shape lives in each sidecar's k8s/ Component (referenced under `components:`).

patches:
  # Node-specific ConfigMap values.
  # DNS names must match prefixed Service names (namePrefix applies to all resources).
  - target:
      kind: ConfigMap
      name: node-app-config
    patch: |
      - op: replace
        path: /data/NODE_NAME
        value: "poly"
      - op: replace
        path: /data/TEMPORAL_NAMESPACE
        value: "cogni-preview"
      - op: replace
        path: /data/LITELLM_BASE_URL
        value: "http://poly-litellm-external:4000"
      - op: replace
        path: /data/TEMPORAL_ADDRESS
        value: "poly-temporal-external:7233"
      - op: replace
        path: /data/REDIS_URL
        value: "redis://poly-redis-external:6379"
      - op: add
        path: /data/NEXTAUTH_URL
        value: "https://poly-preview.cognidao.org"
      # proj.poly-paper-trading PR 2: continuous always-paper twin. The mirror
      # algorithm runs 24/7 against live target activity but every placement
      # routes through the poly-paper-sidecar — no real USDC spent. Production
      # overlay does NOT set this; per-target mode='paper' DB rows control prod.
      - op: add
        path: /data/PAPER_ENFORCE_MODE
        value: "paper"
      - op: add
        path: /data/PAPER_SIDECAR_URL
        value: "http://localhost:9100"
  # NodePort + instance label on selector (prevents cross-node routing)
  - target:
      kind: Service
      name: node-app
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30100
      - op: replace
        path: /spec/ports/0/targetPort
        value: 3100
      - op: add
        path: /spec/selector/app.kubernetes.io~1instance
        value: "poly"
  # Fix secret refs + container port + instance label
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
        value: "poly-node-app-secrets"
      - op: replace
        path: /spec/template/spec/initContainers/0/envFrom/1/secretRef/name
        value: "poly-node-app-secrets"
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 3100
      - op: add
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: "poly"
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: "poly"

  # task.0370 step 1: Doltgres knowledge-plane migrator runs as a second initContainer
  # on the poly Deployment. DATABASE_URL maps to DOLTGRES_URL_POLY (separate from
  # the Postgres DATABASE_URL the main container + first initContainer use).
  - target:
      kind: Deployment
      name: node-app
    patch: |
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: migrate-doltgres
          image: ghcr.io/cogni-dao/cogni-poly:placeholder
          command:
            - /bin/sh
            - -c
            - exec node /app/nodes/$(NODE_NAME)/app/migrate-doltgres.mjs /app/nodes/$(NODE_NAME)/app/doltgres-migrations
          envFrom:
            - configMapRef:
                name: poly-node-app-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: poly-node-app-secrets
                  key: DOLTGRES_URL_POLY
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
  # bug.5025 (2026-05-22): no env-specific external-services overrides.
  # The base manifest (`infra/k8s/base/node-app/external-services.yaml`)
  # provides selectorless Services + EndpointSlices pointing at 10.42.0.1
  # (k3s cni0 gateway). Read the base file header for the full rationale.
