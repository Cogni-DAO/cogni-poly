#
# Selectorless Services + EndpointSlices for k8s → host-Compose connectivity.
# Node apps run in k3s; infra (Postgres, Temporal, LiteLLM, Redis, Doltgres)
# runs on Compose on the same VM. These resources let pods reach Compose
# services via standard k8s DNS (e.g. "postgres-external", "temporal-external").
#
# Address `10.42.0.1` is the k3s flannel default cni0 bridge — the host's
# gateway from any pod's perspective. Same on every default-flannel k3s VM
# (a k3s convention, not a host-specific IP). Compose containers binding
# `0.0.0.0:<port>` are reachable here from the pod CIDR.
#
# bug.5025 (2026-05-22): a prior shape OVERRODE each Service to ExternalName
# pointing at `<env>.vm.cognidao.org`. Public-hostname DNS is out-of-repo
# state and drifts silently; switching to a k3s-internal convention keeps
# addressing in git and survives VM reprovisions. Overlays MUST NOT
# re-introduce ExternalName overrides unless a future env genuinely routes
# through a separate host.

# --- PostgreSQL ---
apiVersion: v1
kind: Service
metadata:
  name: postgres-external
spec:
  clusterIP: None
  ports:
    - port: 5432
      protocol: TCP
      name: postgres
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-external-1
  labels:
    kubernetes.io/service-name: postgres-external
addressType: IPv4
endpoints:
  - addresses:
      - "10.42.0.1"
ports:
  - port: 5432
    protocol: TCP
    name: postgres

