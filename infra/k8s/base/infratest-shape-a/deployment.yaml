apiVersion: apps/v1
kind: Deployment
metadata:
  name: infratest-shape-a
  labels:
    app.kubernetes.io/name: infratest-shape-a
    app.kubernetes.io/part-of: cogni
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: infratest-shape-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: infratest-shape-a
        app.kubernetes.io/part-of: cogni
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: infratest-shape-a
          # No tag - overlay's images: block substitutes the promoted digest.
          image: ghcr.io/cogni-dao/infratest-shape-a
          ports:
            - containerPort: 9000
              name: health
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "100m"
