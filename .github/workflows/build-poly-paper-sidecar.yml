# Builds the poly-paper-sidecar image and pushes it to GHCR. Standalone
# (not in the catalog SSOT) because the sidecar has no per-env deploy branch
# — Argo references the image by tag from the candidate-a + preview overlay
# patches. Triggered by edits under nodes/poly/sidecars/paper-trader/** and by
# manual dispatch when a wrapper iteration needs a fresh image.
#
# Tag scheme:
#   - sha-<short>: every build
#   - latest:      main only (so candidate-a + preview can pin :latest by default)

name: Build poly-paper-sidecar

on:
  push:
    branches: [main]
    paths:
      - "nodes/poly/sidecars/paper-trader/**"
      - ".github/workflows/build-poly-paper-sidecar.yml"
  pull_request:
    paths:
      - "nodes/poly/sidecars/paper-trader/**"
      - ".github/workflows/build-poly-paper-sidecar.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cogni-dao/poly-paper-sidecar

concurrency:
  group: build-poly-paper-sidecar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - id: meta
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          tags="${IMAGE}:sha-${short_sha}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "Built tags: ${tags}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        # Only push from main + workflow_dispatch + same-repo PRs.
        # Forks won't have packages:write; skip the login + skip push.
        if: |
          github.event_name == 'workflow_dispatch' ||
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Smoke gate — builds the `test` stage which runs pytest under a stubbed
      # pm_trader.Engine. CI red here ⇒ no image push. Cheap insurance against
      # a server.py regression sneaking into candidate-a.
      - name: Build + run smoke test (build-blocker)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: nodes/poly/sidecars/paper-trader
          file: nodes/poly/sidecars/paper-trader/Dockerfile
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=poly-paper-sidecar
          cache-to: type=gha,mode=max,scope=poly-paper-sidecar

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: nodes/poly/sidecars/paper-trader
          file: nodes/poly/sidecars/paper-trader/Dockerfile
          target: base
          build-args: |
            BUILD_SHA=${{ github.sha }}
          platforms: linux/amd64
          push: |
            ${{
              github.event_name == 'workflow_dispatch' ||
              github.event_name == 'push' ||
              (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
            }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=poly-paper-sidecar
          cache-to: type=gha,mode=max,scope=poly-paper-sidecar
